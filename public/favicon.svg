<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181C"/>
      <stop offset="100%" stop-color="#111113"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with Obsidian Dark aesthetic -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="#373741" stroke-width="10"/>
  <rect x="28" y="28" width="456" height="456" rx="108" fill="none" stroke="#222228" stroke-width="4"/>

  <!-- Top anvil striking plate -->
  <polygon points="90,160 422,160 376,224 136,224" fill="#A78BFA"/>
  <line x1="102" y1="166" x2="410" y2="166" stroke="#F5F3FF" stroke-width="8" stroke-linecap="round"/>

  <!-- Middle forge waist & faceted depth -->
  <polygon points="186,224 256,224 256,310 166,310" fill="#7C3AED"/>
  <polygon points="256,224 326,224 346,310 256,310" fill="#8B5CF6"/>

  <!-- Base foundation & shadow -->
  <polygon points="120,310 392,310 432,394 80,394" fill="#A78BFA"/>
  <polygon points="96,376 416,376 432,394 80,394" fill="#5B21B6"/>

  <!-- Center radiant spark / productivity crystal -->
  <polygon points="256,239 284,267 256,295 228,267" fill="#EDE9FE" filter="url(#glow)"/>
  <circle cx="256" cy="267" r="12" fill="#FFFFFF"/>
  <line x1="256" y1="227" x2="256" y2="307" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <line x1="216" y1="267" x2="296" y2="267" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
</svg>
